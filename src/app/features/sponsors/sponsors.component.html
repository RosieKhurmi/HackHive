<body class="bg-[var(--background)] pt-[120px]">

  <section>
    <app-menu></app-menu>

  <div class="hero p-9">
    <div class="hero-content">
      <h1 class="text-6xl font-bold mb-5">Sponsors</h1>
      <p class="text-3xl">We are grateful to our sponsors for their support.</p>
    </div>
  </div>
  
  <!-- Platinum Sponsors    -->
  <section class="slideshow">
      <div *ngIf="platinum.length > 0" class="sponsor-section">
        <h1>Platinum Sponsors</h1>
        <app-carousel [slides]="platinum" [slideTemplate]="sponsorTemplate"></app-carousel>
        <ng-template #sponsorTemplate let-sponsor>
          <app-sponsor-card
            [image]="{ src: sponsor.logo, alt: sponsor.name }"
            [tier]="sponsor.tier"
            [description]="sponsor.description"
          ></app-sponsor-card>
        </ng-template>
      </div>
        
  </section>
  
  <!-- Gold Sponsors -->
  <section>
      <div *ngIf="gold.length > 0" class="sponsor-section">
          <h1>Gold Sponsors</h1>
          <div class="cards">
            <div *ngFor="let s of gold">
              <app-sponsor-card 
                  [image]="{src: s.logo, alt: s.name}"
                  [tier]="s.tier"
                  [ngClass]="s.tier">
              </app-sponsor-card>
            </div>
          </div>
        </div>
  </section>
  
  <!-- Silver Sponsors -->
  <section>
      <div *ngIf="silver.length > 0" class="sponsor-section">
          <h1>Silver Sponsors</h1>
          <div class="cards">
            <div *ngFor="let s of silver">
              <app-sponsor-card 
                  [image]="{src: s.logo, alt: s.name}"
                  [tier]="s.tier"
                  [description]="s.description"
                  [ngClass]="s.tier">
              </app-sponsor-card>
            </div>
          </div>
        </div>
  </section>
  
  <!-- Bronze Sponsors -->
  <section>
      <div *ngIf="bronze.length > 0" class="sponsor-section">
          <h1>Bronze Sponsors</h1>
          <div class="cards">
            <div *ngFor="let s of bronze">
              <app-sponsor-card 
                  [image]="{src: s.logo, alt: s.name}"
                  [tier]="s.tier"
                  [ngClass]="s.tier">
              </app-sponsor-card>
          </div>
          </div>
        </div>
  </section>
  
  <!-- Collaborator Sponsors -->
  <section>
      <div *ngIf="collaborator.length > 0" class="sponsor-section">
          <h1>Collaborators</h1>
          <div class="cards">
            <div *ngFor="let s of collaborator">
              <app-sponsor-card 
                  [image]="{src: s.logo, alt: s.name}"
                  [tier]="s.tier"
                  [ngClass]="s.tier">
              </app-sponsor-card>
            </div>
        </div>
      </div>
  </section>
  
    <app-footer></app-footer>
  </section>

</body>
