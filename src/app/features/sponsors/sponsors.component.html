<app-menu></app-menu>

<!-- Platinum Sponsors    -->
<section>
    <div *ngIf="platinum.length > 0">
        <h1>Platinum Sponsors</h1>
        <div *ngFor="let s of platinum">
          <app-sponsor-card 
              [image]="{src: s.logo, alt: s.name}"
              [tier]="s.tier"
              [description]="s.description"
              [ngClass]="s.tier">
          </app-sponsor-card>
        </div>
      </div>
</section>
