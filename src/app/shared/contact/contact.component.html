<header>
    <form style="display: flex; flex-direction: column;" [formGroup]="contactForm" (ngSubmit)="onSubmit()" action="javascrpit:void(0)">
    
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" formControlName="name"/>
        <div *ngIf="contactForm.controls['name'].invalid && (contactForm.controls['name'].dirty || isValid || contactForm.controls['name'].touched)">
            <span *ngIf="contactForm.controls['name'].errors?.['required']">Name is required</span>
        </div>
    
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" formControlName="email"/>
        <div *ngIf="contactForm.controls['email'].invalid && (contactForm.controls['email'].dirty || isValid || contactForm.controls['email'].touched)">
            <span *ngIf="contactForm.controls['email'].errors?.['required']">Invalid email address</span>
            <span *ngIf="contactForm.controls['email'].errors?.['email']">Invalid email address</span>
        </div>
    
        <label for="message">Message:</label>
        <textarea id="message" name="message" formControlName="message"></textarea>
        <div *ngIf="contactForm.controls['message'].invalid && (contactForm.controls['name'].dirty || isValid || contactForm.controls['name'].touched)">
            <span *ngIf="contactForm.controls['name'].errors?.['required']">Name is required</span>
        </div>
    
        <input class="bg-purple-600 hover:bg-purple-500 text-white font-semibold p-3 mt-6 rounded-full transition duration-300 mx-auto" type="submit" value="Submit"/>

    </form>
</header>
