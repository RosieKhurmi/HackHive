<div class="group cursor-pointer">
    <div class="bg-white p-6 shadow-lg">
      <h3 class="text-xl font-bold mb-4">{{ title }}</h3>
      <p class="text-gray-600 mb-4">{{ description }}</p>
      <ul class="list-disc ml-6 text-gray-600">
        <li class="mb-2" *ngFor="let point of points">
          <strong>{{ point.title }}:</strong> {{ point.details }}
        </li>
      </ul>
    </div>
  
    <!-- Expandable content -->
    <div class="max-h-0 overflow-hidden bg-zinc-100 rounded-lg shadow-xl
                transition-all duration-300 ease-in-out
                group-hover:max-h-[2000px]">
      <div class="p-6">
        <h4 class="font-bold mb-4">{{ expandableTitle }}</h4>
        <ol class="list-decimal ml-6 space-y-4">
          <li *ngFor="let item of expandableContent" class="list-none">
            <strong>{{ item.title }}:</strong>
            <ul class="list-disc ml-6 mt-2 list-none">
              <li *ngFor="let subItem of item.details">{{ subItem }}</li>
            </ul>
          </li>
        </ol>
      </div>
    </div>
  </div>
