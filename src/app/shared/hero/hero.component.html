<section class="pt-[140px]">

    <div class="justify-center items-center flex flex-col">
        <h1 class="text-6xl text-center font-extrabold mb-4">
          <ng-content>{{title}}</ng-content>
        </h1>
        <p class="text-3xl text-center max-w-md">{{subtitle}}</p>
        
        <div class="text-center p-6">
          @for (item of text; track $index) {
            <p class="text-xl pb-2">{{item}}</p>
          }
        </div>
    </div>


</section>
